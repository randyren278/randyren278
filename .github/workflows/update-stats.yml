name: Update honest stats

on:
  schedule:
    # 6am / 6pm Pacific, expressed in UTC since GitHub Actions cron has no
    # timezone support. Two pairs of entries handle PST (UTC-8) vs PDT (UTC-7),
    # with March/November overlap on both pairs so the DST transition weeks
    # get a duplicate run instead of a silently missed one.
    - cron: '0 14 * 11,12,1,2,3 *'   # 6am PST (winter months)
    - cron: '0 2 * 11,12,1,2,3 *'    # 6pm PST (winter months)
    - cron: '0 13 * 3,4,5,6,7,8,9,10,11 *'  # 6am PDT (summer months)
    - cron: '0 1 * 3,4,5,6,7,8,9,10,11 *'   # 6pm PDT (summer months)
  workflow_dispatch:

permissions:
  contents: write

env:
  ROLE: "Student @ UBC · ex-intern @ SAP, Visa"
  FOCUS: "AI agents, context engineering, and supervision"
  EDITOR: "VS Code"
  SITE: "randyren.org"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute total commit count (all years, incl. private)
        id: commits
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          set -euo pipefail

          CREATED_YEAR=$(gh api graphql -f query='
            query { viewer { createdAt } }
          ' --jq '.data.viewer.createdAt' | cut -c1-4)
          CURRENT_YEAR=$(date -u +%Y)
          TOTAL=0

          for YEAR in $(seq "$CREATED_YEAR" "$CURRENT_YEAR"); do
            YEAR_COMMITS=$(gh api graphql -f query='
              query($from: DateTime!, $to: DateTime!) {
                viewer {
                  contributionsCollection(from: $from, to: $to) {
                    totalCommitContributions
                    restrictedContributionsCount
                  }
                }
              }
            ' -f from="${YEAR}-01-01T00:00:00Z" -f to="${YEAR}-12-31T23:59:59Z" \
              --jq '.data.viewer.contributionsCollection | .totalCommitContributions + .restrictedContributionsCount')
            TOTAL=$((TOTAL + YEAR_COMMITS))
          done

          echo "Total commits (all-time, incl. private): $TOTAL"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Compute lines of code (owned, non-fork repos)
        id: loc
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          set -euo pipefail

          LOGIN=$(gh api graphql -f query='query { viewer { login } }' --jq '.data.viewer.login')
          NAME=$(gh api graphql -f query='query { viewer { name } }' --jq '.data.viewer.name // empty')
          PATTERN="$LOGIN"
          if [ -n "$NAME" ]; then PATTERN="$LOGIN|$NAME"; fi

          ADD=0
          DEL=0
          mkdir -p /tmp/loc-repos

          REPOS=$(gh api /user/repos --paginate -q '.[] | select(.fork==false) | .full_name')

          for REPO in $REPOS; do
            DIR="/tmp/loc-repos/$(echo "$REPO" | tr '/' '__')"
            if git clone --quiet --depth=100000 --filter=blob:none \
                "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$DIR" 2>/dev/null; then
              STATS=$(cd "$DIR" && git log --no-merges --pretty=tformat: --numstat -E -i --author="$PATTERN" 2>/dev/null \
                | awk 'NF==3 && $1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ {add+=$1; del+=$2} END{print add+0, del+0}')
              REPO_ADD=$(echo "$STATS" | cut -d' ' -f1)
              REPO_DEL=$(echo "$STATS" | cut -d' ' -f2)
              ADD=$((ADD + REPO_ADD))
              DEL=$((DEL + REPO_DEL))
              rm -rf "$DIR"
            fi
          done

          echo "Lines: +$ADD / -$DEL"
          echo "add=$ADD" >> "$GITHUB_OUTPUT"
          echo "del=$DEL" >> "$GITHUB_OUTPUT"

      - name: Render profile card SVG
        run: |
          python3 scripts/render_card.py \
            --photo assets/avatar-ascii.jpg \
            --name "Randy Ren" \
            --role "$ROLE" \
            --focus "$FOCUS" \
            --editor "$EDITOR" \
            --site "$SITE" \
            --commits "${{ steps.commits.outputs.total }}" \
            --loc-add "${{ steps.loc.outputs.add }}" \
            --loc-del "${{ steps.loc.outputs.del }}" \
            --out assets/card.svg

      - name: Commit rendered card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/card.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile card"
          git push
